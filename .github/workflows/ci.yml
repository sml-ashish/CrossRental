name: CI

# Pull requests and pushes to main are checked here. Tagging uat_v* also runs
# this suite as the first job of the Deploy workflow, so a release is gated.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossrental
          POSTGRES_PASSWORD: crossrental
          POSTGRES_DB: crossrental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossrental -d crossrental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crossrental:crossrental@localhost:5432/crossrental_test
      TEST_DATABASE_URL: postgresql://crossrental:crossrental@localhost:5432/crossrental_test
      # Test-only placeholders: config/env requires these at import time.
      JWT_SECRET: ci-test-jwt-secret
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_HOST: console
      SMTP_USER: console
      SMTP_PASS: console
      MAIL_TRANSPORT: console
      GEO_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
