name: UAT Deploy

# Push a tag like uat_v1.2.0 (or create a GitHub Release for it) and this
# workflow pulls that tag on the UAT server, rebuilds the images there and
# restarts the containers. No tests, no registry, no branch triggers.
#
# The server has the repository cloned at DEPLOY_PATH and its own `.env`
# (created once from `.env.docker.example`). Both are required.
#
# Required secrets, stored in the `uat` GitHub Environment
# (Settings -> Environments -> uat -> Environment secrets):
#   DEPLOY_HOST      UAT server hostname or IP
#   DEPLOY_USER      SSH user (must be in the `docker` group)
#   DEPLOY_SSH_KEY   private key for that user
#   DEPLOY_PATH      clone of this repository on the server (e.g. /home/ubuntu/CrossRental)
#   DEPLOY_PORT      optional, defaults to 22
#   UAT_DATABASE_URL optional; when set it is written into the server `.env` on
#                    each deploy (the password must not live in git)

on:
  push:
    tags: ["uat_v*"]
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull and rebuild on UAT
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GIT_REF: ${{ github.ref_name }}
          DATABASE_URL: ${{ secrets.UAT_DATABASE_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,GIT_REF,DATABASE_URL
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # Check out the tag first so deploy/uat-deploy.sh exists even if the
            # server clone is stale. The script then rebuilds and restarts.
            git fetch --all --tags --prune
            git checkout -f "$GIT_REF"
            bash deploy/uat-deploy.sh "$GIT_REF"
