name: UAT Deploy

# Single UAT pipeline. Push a tag like uat_v1.2.0 (or create a GitHub Release
# with that tag) and this workflow:
#   1. runs the backend and frontend checks,
#   2. builds and pushes both images to GHCR,
#   3. rolls them out to the UAT server over SSH.
#
# Nothing runs for branch pushes or pull requests.
#
# The server keeps its own `.env` in DEPLOY_PATH, created once from
# `.env.docker.example`. It is not stored in GitHub. The workflow only updates
# the two image-tag lines in it before pulling.
#
# Required secrets, stored in the `uat` GitHub Environment
# (Settings -> Environments -> uat -> Environment secrets):
#   DEPLOY_HOST      UAT server hostname or IP
#   DEPLOY_USER      SSH user (must be in the `docker` group)
#   DEPLOY_SSH_KEY   private key for that user
#   DEPLOY_PATH      directory holding docker-compose.yml + .env
#   DEPLOY_PORT      optional, defaults to 22
#   GHCR_TOKEN       optional PAT with read:packages; only needed while the
#                    GHCR packages are private (no token -> no login attempt)

on:
  push:
    tags: ["uat_v*"]
  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossrental
          POSTGRES_PASSWORD: crossrental
          POSTGRES_DB: crossrental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossrental -d crossrental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crossrental:crossrental@localhost:5432/crossrental_test
      TEST_DATABASE_URL: postgresql://crossrental:crossrental@localhost:5432/crossrental_test
      # Test-only placeholders: config/env requires these at import time.
      JWT_SECRET: ci-test-jwt-secret
      FIELD_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SMTP_HOST: console
      SMTP_USER: console
      SMTP_PASS: console
      MAIL_TRANSPORT: console
      GEO_PROVIDER: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  build:
    name: Build & push ${{ matrix.name }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out to UAT
    needs: build
    runs-on: ubuntu-latest
    environment: uat

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull and restart
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_USER,IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -e
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "Missing .env in $DEPLOY_PATH. Copy .env.docker.example to .env and fill it in."
              exit 1
            fi

            PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d' .env
            {
              echo "BACKEND_IMAGE=${PREFIX}-backend:${IMAGE_TAG}"
              echo "FRONTEND_IMAGE=${PREFIX}-frontend:${IMAGE_TAG}"
            } >> .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
