server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Load charts and onboarding documents can be up to UPLOAD_MAX_MB (10 MB).
    client_max_body_size 12m;

    # Same-origin API: the SPA calls /api and this forwards to the backend
    # service on the compose network. `proxy_pass` has no trailing path, so the
    # /api prefix is preserved.
    location /api/ {
        proxy_pass http://backend:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Long-lived hashed assets; the HTML shell is never cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
